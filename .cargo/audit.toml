[advisories]
ignore = [
    "RUSTSEC-2026-0222", # wasmtime: Stores can mix up type indices between engines. ZethraOS sandboxes instantiate a single Store per Engine without cross-engine sharing, rendering this advisory inapplicable.
    "RUSTSEC-2026-0269", # wasmtime: Filesystem sandbox escape in wasmtime-wasi when paths/symlinks contain trailing slashes. wasmtime-wasi is absent from the dependency graph; no WASI filesystem context is linked; no guest filesystem preopens are exposed; sandbox interaction uses only custom in-memory host imports.
    "RUSTSEC-2026-0316", # wasmtime: Dynamic record lifting can allocate beyond hostcall fuel limit in Component Model. ZethraOS sandbox exclusively loads core WASM modules (Module::from_binary) without the Component Model; guest memory growth is strictly bounded by MemoryLimiter (ResourceLimiter, 64MB hard ceiling) independent of fuel.
]
